name: Build dashboard Docker Image

on:
  workflow_call:

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build ${{ matrix.image.name }} Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: dashboard
            repository: ghcr.io/vekjja/espwifi
            context: .
            dockerfile: ./dashboard/Dockerfile.prebuilt
            needs_dashboard: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download pre-built dashboard
        if: matrix.image.needs_dashboard
        uses: actions/download-artifact@v4
        with:
          name: dashboard-build
          path: data

      - name: Compute tags
        id: vars
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TAG="pr-${{ github.event.number }}-${SHORT_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${REF_NAME}"
          else
            TAG="${REF_NAME}-${SHORT_SHA}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref_name=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Docker Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Docker Set up Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker Login
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ matrix.image.repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=development,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          pull: true
          push: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
