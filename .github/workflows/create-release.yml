name: Create Release

on:
  workflow_call:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '{dashboard-zip,firmware-*}'
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          find release-artifacts -type f ! -name 'metadata-*.json' -exec cp {} release/ \;
          ls -lh release/

      - name: Extract release notes from tag
        id: release_notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          METADATA_FILES=(release-artifacts/*/metadata-*.json)
          ENVIRONMENTS=()
          CHIPS=()
          BAUDS=()
          OFFSETS=()

          for meta_file in "${METADATA_FILES[@]}"; do
            if [ -f "$meta_file" ]; then
              env=$(jq -r '.environment' "$meta_file")
              chip=$(jq -r '.chip' "$meta_file")
              baud=$(jq -r '.baud' "$meta_file")
              offset=$(jq -r '.bootloader_offset' "$meta_file")

              ENVIRONMENTS+=("$env")
              CHIPS+=("$chip")
              BAUDS+=("$baud")
              OFFSETS+=("$offset")
            fi
          done

          cat > release_notes.md << RELEASE_START
          ## 📦 Packaged Environments:
          RELEASE_START

          for env in "${ENVIRONMENTS[@]}"; do
            echo "- ${env^^}" >> release_notes.md
          done
          echo "" >> release_notes.md

          echo "**💽 Firmware Binaries:**" >> release_notes.md
          for env in "${ENVIRONMENTS[@]}"; do
            echo "- \`espwifi-firmware-${env}-${VERSION}.bin\` - ${env^^} firmware" >> release_notes.md
          done
          echo "" >> release_notes.md

          echo "**📲 Bootloaders:**" >> release_notes.md
          for env in "${ENVIRONMENTS[@]}"; do
            echo "- \`espwifi-bootloader-${env}-${VERSION}.bin\` - ${env^^} bootloader" >> release_notes.md
          done
          echo "" >> release_notes.md

          echo "**💾 Partition Tables:**" >> release_notes.md
          for env in "${ENVIRONMENTS[@]}"; do
            echo "- \`espwifi-partitions-${env}-${VERSION}.bin\` - ${env^^} partition table" >> release_notes.md
          done
          echo "" >> release_notes.md

          echo "**🖥️ Dashboard:**" >> release_notes.md
          echo "- \`espwifi-dashboard-${VERSION}.zip\` - Dashboard Embedded Zip" >> release_notes.md
          echo "" >> release_notes.md

          echo "**🐳 Docker Images:**" >> release_notes.md
          echo "- \`ghcr.io/vekjja/espwifi:${VERSION}\` - Dashboard Docker Image" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "ESPWiFi: 🎉 ${{ steps.release_notes.outputs.version }} 🎉"
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
