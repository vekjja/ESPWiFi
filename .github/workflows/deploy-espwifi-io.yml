name: Deploy espwifi.io

on:
  workflow_call:

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBECONFIG }}" > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Helm upgrade
        run: |
          set -euo pipefail
          helm upgrade --install espwifi-io ./espwifi.io -f ./espwifi.io/values.yaml \
            --namespace espwifi-io --create-namespace \
            --set image.tag="${GITHUB_REF_NAME}"

      - name: Record deployed tag on main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          perl -0777 -i -pe "s/(^image:\\n(?:.*\\n)*?\\s*tag:\\s*\")([^\"]+)(\")/\\1${GITHUB_REF_NAME}\\3/m" espwifi.io/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add espwifi.io/values.yaml
          git commit -m "chore(helm): record deployed tag ${GITHUB_REF_NAME} [skip ci]" || exit 0
          git push origin main
